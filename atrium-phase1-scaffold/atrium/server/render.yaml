services:
  - type: web
    name: atrium-api
    runtime: node
    rootDir: atrium-phase1-scaffold/atrium/server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard — never commit this value
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard — never commit this value
      - key: CLIENT_URL
        sync: false        # set to your Vercel frontend URL after deploying the frontend
